<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keychain Maker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='6' width='88' height='88' rx='14' fill='%23d9d9d4'/><circle cx='34' cy='34' r='13' fill='%23161616'/><circle cx='66' cy='66' r='13' fill='%23ff5a1f'/></svg>" />
    <script>
      try { if (localStorage.getItem('keychain-maker:theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="brand">
          <div class="plate">
            <h1>keychain maker</h1>
            <p>svg o texto a llavero imprimible</p>
          </div>
          <div class="brand-side">
            <button class="theme" id="theme" title="Cambiar a modo oscuro" aria-label="Cambiar a modo oscuro">
              <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 0.8v2M8 13.2v2M0.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M2.9 13.1l1.4-1.4M11.7 4.3l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>
            </button>
            <span class="model" aria-hidden="true">km-1</span>
          </div>
        </header>

        <section class="mod" style="--mod: var(--blue)">
          <h2><i class="knob"></i>1 diseño</h2>
          <div class="keys tabs" role="tablist">
            <button data-src="svg" class="active">svg</button>
            <button data-src="text">texto</button>
            <button data-src="shape">formas</button>
          </div>

          <div data-pane="svg">
            <label class="drop" id="drop">
              <input type="file" id="svgFile" accept=".svg,image/svg+xml" hidden />
              <strong id="dropTitle">Arrastra un SVG aquí</strong>
              <span>o haz clic para elegirlo</span>
            </label>
            <details>
              <summary>Pegar código SVG</summary>
              <textarea id="svgPaste" rows="4" placeholder="&lt;svg ...&gt;...&lt;/svg&gt;"></textarea>
              <button id="svgPasteBtn">Usar este SVG</button>
            </details>
          </div>

          <div data-pane="text" hidden>
            <textarea id="text" rows="2">Cris</textarea>
            <div class="row">
              <label>Fuente
                <select id="font"></select>
              </label>
            </div>
            <label class="file-inline">o sube tu fuente (.ttf, .otf, .woff)
              <input type="file" id="fontFile" accept=".ttf,.otf,.woff" />
            </label>
            <div class="row two">
              <label>Espaciado <input type="number" id="letterSpacing" step="0.01" value="0" /></label>
              <label>Interlínea <input type="number" id="lineHeight" step="0.05" value="1.05" /></label>
            </div>
            <div class="keys seg" id="align">
              <button data-v="left">izq.</button><button data-v="center" class="active">centro</button><button data-v="right">der.</button>
            </div>
          </div>

          <div data-pane="shape" hidden>
            <div class="shapes" id="shapes"></div>
          </div>

          <div class="fields" data-group="design"></div>
        </section>

        <section class="mod" style="--mod: var(--green)">
          <h2><i class="knob"></i>2 base y relieve</h2>
          <div class="fields" data-group="base"></div>
        </section>

        <section class="mod" style="--mod: var(--white)">
          <h2><i class="knob"></i>3 arandela</h2>
          <div class="fields" data-group="ring"></div>
          <p class="hint" id="manualHint" hidden>Haz clic en la vista 3D para colocar la anilla.</p>
        </section>

        <section class="mod" style="--mod: var(--orange)">
          <h2><i class="knob"></i>4 colores de vista previa</h2>
          <div class="row two swatches">
            <label>Base <input type="color" id="colBase" value="#2a2a2a" /></label>
            <label>Relieve <input type="color" id="colRelief" value="#ff5a1f" /></label>
          </div>
        </section>
      </aside>

      <main class="stage">
        <div class="screen">
          <div class="stats" id="stats">cargando motor…</div>
          <div class="warn" id="warn" hidden></div>
          <div class="err" id="err" hidden></div>
        </div>
        <div class="view">
          <div id="viewer"></div>
          <button class="key reframe" id="reframe" title="Encuadrar" aria-label="Encuadrar la vista">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
        <div class="export">
          <label class="name">
            <span>archivo</span>
            <input id="fileName" value="llavero" aria-label="Nombre del archivo" />
          </label>
          <div class="export-keys">
            <button id="dlBase" class="key" title="Para imprimir en dos colores">stl base</button>
            <button id="dlRelief" class="key" title="Para imprimir en dos colores">stl relieve</button>
            <button class="key primary" id="dlAll">descargar stl</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
